<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WOW OMNI — Offline</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0B0F19;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      box-sizing: border-box;
      text-align: center;
      padding: 24px;
    }
    .badge {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #38BDF8;
      margin-bottom: 8px;
      font-weight: 700;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 12px;
    }
    p {
      color: #94A3B8;
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background: linear-gradient(135deg, #2563EB, #38BDF8);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="badge">WOW OMNI</div>
  <h1>No Internet Connection</h1>
  <p>Mukhang offline ka ngayon. I-check ang Wi-Fi o mobile data mo para magpatuloy.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
