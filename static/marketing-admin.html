<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WOW AI Marketing Studio</title><style>body{font:16px system-ui;background:#061426;color:#e9f4ff;margin:auto;max-width:900px;padding:22px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0 15px;border-radius:10px;border:1px solid #38547a;background:#122b4c;color:white}button{background:#167cdb;cursor:pointer;font-weight:bold}.card{padding:18px;border:1px solid #345276;border-radius:15px;margin:18px 0}a{color:#79c8ff}.muted{color:#aac1d6}pre{white-space:pre-wrap}</style><h1>💙 WOW AI Marketing Studio</h1><p class="muted">Admin only · Caption templates, promotional posters & silent video cards. Optional AI captions require a server API key. Approval saves the decision; it does not publish to social media.</p><a href="/admin">← Back to Admin</a><div class="card"><label>Business / Brand</label><select id="brand"><option>WOW SUPER APP</option><option>WOW NINA</option><option>WOW SHOP DIGITAL</option><option>WOW WEB STUDIO</option></select><label>What are you promoting?</label><textarea id="topic" rows="3" placeholder="Describe your promotion, product, features, offer, or app tour"></textarea><label>Platform</label><select id="channel"><option>Facebook</option><option>Instagram</option><option>TikTok</option><option>YouTube Shorts</option></select><label>Call to action</label><input id="cta" value="Join us today"><label>Caption mode</label><select id="mode"><option value="template">Free template</option><option value="ai">AI caption (provider required)</option></select><label>Language for AI caption</label><select id="language"><option>English</option><option>Tagalog</option><option>Bisaya</option></select><button id="create-button" onclick="create()">✨ Generate Marketing Draft</button><div id="notice"></div></div><h2>Drafts for your approval</h2><div id="drafts"></div><script>const token=localStorage.getItem('wow_token');const headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(path,opts={}){const r=await fetch(path,{...opts,headers});const x=await r.json();if(!r.ok)throw Error(x.detail||'Request failed');return x}async function create(){document.getElementById("create-button").disabled=true;try{const x=await req('/api/admin/marketing/drafts',{method:'POST',body:JSON.stringify({brand:brand.value,topic:topic.value,channel:channel.value,cta:cta.value,use_ai:document.getElementById('mode').value==='ai',language:document.getElementById('language').value})});notice.textContent='Draft created #'+x.id+' — '+x.note;load()}catch(e){notice.textContent=e.message}finally{document.getElementById("create-button").disabled=false}}async function download(id,ext){const r=await fetch('/api/admin/marketing/drafts/'+id+'/'+(ext==='png'?'visual.png':'video.mp4'),{headers:{Authorization:'Bearer '+token}});if(!r.ok){alert('Download unavailable ('+r.status+')');return}const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wow-marketing-'+id+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}async function setDraftStatus(id,value){try{await req('/api/admin/marketing/drafts/'+id+'/status',{method:'PUT',body:JSON.stringify({status:value})});load()}catch(e){alert(e.message)}}async function copyCaption(id){try{await navigator.clipboard.writeText(document.getElementById('caption-'+id).value);notice.textContent='Caption copied.'}catch(e){notice.textContent='Select the caption text to copy it.'}}async function load(){try{const x=await req('/api/admin/marketing/drafts');drafts.innerHTML=x.drafts.map(d=>`<div class="card"><b>${esc(d.brand)} — ${esc(d.status)}</b><p>${esc(d.channel)} • ${esc(d.topic)}</p><pre>${esc(d.caption)}</pre><button onclick="copyCaption(${d.id})">Copy Caption</button><textarea hidden id="caption-${d.id}">${esc(d.caption)}</textarea><button onclick="download(${d.id},'png')">Download Poster PNG</button><button onclick="download(${d.id},'mp4')">Download 12s Video MP4</button><button onclick="setDraftStatus(${d.id},'approved')">Approve Draft</button><button onclick="setDraftStatus(${d.id},'rejected')">Reject Draft</button></div>`).join('')||'<p>No drafts yet.</p>'}catch(e){drafts.textContent='Admin login required: '+e.message}}load();</script></html>
