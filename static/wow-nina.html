<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WOW NINA | WOW SUPER APP</title><style>body{margin:0;font-family:system-ui;background:radial-gradient(circle at 70% 0%,#113c76,#050b18 60%);color:#eaf5ff}main{max-width:1050px;margin:40px auto;padding:22px}.panel{padding:26px;border:1px solid #2374b6;border-radius:22px;background:#081c35}h1{font-size:clamp(30px,6vw,56px)}p{line-height:1.6;color:#c4d6ee}a{display:inline-block;background:#138ce8;color:white;padding:12px 16px;border-radius:12px;text-decoration:none;margin:5px 5px 5px 0}.secondary{background:#183353}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-top:20px}.card{padding:16px;border:1px solid #1b5b9c;border-radius:12px;background:#0a2749}.card img{width:100%;height:240px;object-fit:cover;border-radius:9px}.price{font-size:22px;color:#65c8ff;font-weight:800}</style></head><body><main><a class="secondary" href="/">← WOW SUPER APP</a><div class="panel"><h1>WOW NINA</h1><p>Fashion & Streetwear by Muzayyanah · Browse our latest T-shirts and message us to order.</p><a href="https://www.facebook.com/share/18emeGgHp2/?mibextid=wwXIfr" target="_blank" rel="noopener">Message WOW NINA on Facebook</a><a class="secondary" href="/admin/wow-nina">Manage Products (Admin)</a></div><h2>Our Collection</h2><div class="grid" id="products">Loading collection...</div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/wow-nina/products').then(r=>r.json()).then(d=>{products.innerHTML=d.products.length?d.products.map(p=>`<div class="card">${p.image_path?`<img src="/api/wow-nina/photo/${encodeURIComponent(p.image_path)}" alt="${esc(p.title)}">`:''}<h3>${esc(p.title)}</h3><p>${esc(p.brand)} · ${esc(p.condition)}</p><div class="price">₱${Number(p.price).toLocaleString()}</div><p>Sizes: ${esc(p.sizes)} · ${p.stock>0?p.stock+' available':'Sold out'}</p><p>${esc(p.description)}</p><a href="https://www.facebook.com/share/18emeGgHp2/?mibextid=wwXIfr" target="_blank" rel="noopener">Message to Order</a></div>`).join(''):'No products uploaded yet.'}).catch(()=>products.textContent='Unable to load collection.');</script></body></html>
