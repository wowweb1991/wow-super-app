<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WOW • Motivation Admin</title><style>body{font:16px system-ui;background:#071528;color:#e9f6ff;max-width:850px;margin:30px auto;padding:16px}textarea{width:100%;box-sizing:border-box;min-height:90px;background:#122b49;color:white;border:1px solid #5b93c9;padding:12px;border-radius:10px}button{background:#237ac1;color:white;border:0;border-radius:8px;padding:10px 14px;margin:6px;cursor:pointer}article{border:1px solid #2d567e;border-radius:10px;padding:14px;margin:12px 0}a{color:#80caff}</style><a href="/admin">← Back to Admin</a><h1>✨ Daily Motivation Manager</h1><p>Only admin accounts can manage quotes. The active quote rotates daily using Philippine time. Draft quotes should be reviewed by Muzayyanah before publishing under her name.</p><textarea id="new" placeholder="Write an original quote..."></textarea><button onclick="add()">Add Quote</button><p id="status"></p><div id="list"></div><script>let token=localStorage.getItem('wow_token')||'';const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};const S=x=>document.getElementById(x);async function api(path,opt={}){let r=await fetch(path,{...opt,headers:H});let d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}async function load(){try{let d=await api('/api/admin/motivation');S('list').replaceChildren();for(let q of d.quotes){let e=document.createElement('article'),t=document.createElement('textarea'),save=document.createElement('button'),hide=document.createElement('button');t.value=q.quote;t.disabled=!q.active;save.textContent='Save changes';hide.textContent=q.active?'Hide quote':'Hidden';save.disabled=hide.disabled=!q.active;save.onclick=async()=>{try{await api('/api/admin/motivation/'+q.id,{method:'PUT',body:JSON.stringify({quote:t.value})});S('status').textContent='Saved'}catch(e){S('status').textContent=e.message}};hide.onclick=async()=>{if(!confirm('Hide this quote?'))return;await api('/api/admin/motivation/'+q.id,{method:'DELETE'});load()};e.append(t,save,hide);S('list').append(e)}}catch(e){S('status').textContent=e.message+' — Sign in with your admin account first.'}}async function add(){try{await api('/api/admin/motivation',{method:'POST',body:JSON.stringify({quote:S('new').value})});S('new').value='';S('status').textContent='Quote added';load()}catch(e){S('status').textContent=e.message}}load()</script></html>
