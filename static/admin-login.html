<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WOW Administrator Sign In</title><style>body{background:#071222;color:#eef6ff;font:16px system-ui;margin:0}main{max-width:440px;margin:8vh auto;padding:25px}form{padding:24px;border:1px solid #31577e;border-radius:18px;background:#102640}label{display:block;margin:15px 0}input,button{width:100%;box-sizing:border-box;font:inherit;padding:12px;border-radius:9px;margin-top:7px}input{background:#071222;color:white;border:1px solid #54789c}button{background:#258ceb;color:white;border:0;cursor:pointer}a{color:#87c9ff}#message{line-height:1.5}</style><main><a href="/">← WOW SUPER APP</a><h1>Administrator Sign In</h1><p>Admin &amp; Super Admin Control Center</p><form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="submit">Sign in</button><p id="message" role="status"></p></form><p>Use an authorized administrator account. If access is not enabled, the server owner must provision the existing account.</p></main><script>
const $=id=>document.getElementById(id);$('login').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('message').textContent='Checking access…';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Sign in failed');localStorage.setItem('wow_token',d.token);location.href='/admin'}catch(e){$('message').textContent=e.message}finally{$('submit').disabled=false}};
</script></html>
