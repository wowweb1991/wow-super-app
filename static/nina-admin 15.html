<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WOW NINA | Product Manager</title><style>body{background:#071225;color:#eaf5ff;font:16px system-ui;margin:0}main{max-width:1050px;margin:auto;padding:22px}h1{color:#51b9ff}input,textarea,select,button{box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #34618b;font:inherit}input,textarea,select{background:#0e2440;color:white;width:100%}button{background:#168be4;color:white;cursor:pointer}button.secondary{background:#254260}.panel,.item{border:1px solid #22527c;background:#0b1d35;border-radius:15px;padding:20px;margin:18px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}label{display:block;font-size:13px;color:#bdd3e8}label>*{margin-top:6px}img{max-width:190px;max-height:170px;object-fit:contain;border-radius:8px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}a{color:#7ed0ff}#msg{min-height:20px}</style></head><body><main><a href="/">← Home</a> · <a href="/static/wow-nina.html">View WOW NINA Shop</a><h1>WOW NINA Product Manager</h1><p>Admin only · Add, edit, upload photos, or mark T-shirts sold out.</p><p id="msg"></p><section class="panel"><h2 id="formTitle">Add T-shirt</h2><form id="form"><div class="fields"><label>Product name<input id="title" required maxlength="120" placeholder="Stussy Oversized Tee"></label><label>Brand<input id="brand" maxlength="80"></label><label>Price ₱<input id="price" type="number" min="0" step="0.01" required></label><label>Sizes<input id="sizes" placeholder="M, L, XL"></label><label>Stock quantity<input id="stock" type="number" min="0" value="1" required></label><label>Condition<select id="condition"><option>Brand New</option><option>Thrift</option></select></label></div><label>Description<textarea id="description" rows="3"></textarea></label><label><input id="active" type="checkbox" checked style="width:auto"> Visible in shop</label><div class="actions"><button type="submit">Save Product</button><button type="button" class="secondary" onclick="resetForm()">Clear</button></div></form></section><h2>My Products</h2><div id="items">Loading...</div></main><script>
const token=localStorage.getItem('wow_token');let products=[],editId=null;
const msg=t=>document.getElementById('msg').textContent=t;
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{Authorization:'Bearer '+token,...(opts.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'Request failed ('+r.status+')');return data}
function values(){return {title:title.value,brand:brand.value,price:Number(price.value),sizes:sizes.value,stock:Number(stock.value),condition:document.getElementById('condition').value,description:description.value,active:active.checked}}
function resetForm(){editId=null;form.reset();stock.value=1;formTitle.textContent='Add T-shirt'}
async function load(){try{const data=await api('/api/wow-nina/products?admin=true');products=data.products;items.innerHTML=products.length?products.map(p=>`<div class="item"><h3>${escapeHtml(p.title)} — ₱${Number(p.price).toLocaleString()}</h3>${p.image_path?`<img src="/api/wow-nina/photo/${encodeURIComponent(p.image_path)}" alt="Product photo">`:''}<p>${escapeHtml(p.brand)} · ${escapeHtml(p.condition)} · Sizes: ${escapeHtml(p.sizes)} · Stock: ${p.stock} · ${p.active?'Visible':'Hidden'}</p><p>${escapeHtml(p.description)}</p><div class="actions"><button onclick="edit(${p.id})">Edit</button><label>Upload photo <input type="file" accept="image/*" onchange="upload(${p.id},this)" style="max-width:250px"></label><button class="secondary" onclick="hide(${p.id})">Hide / Sold Out</button></div></div>`).join(''):'No products yet. Add your first T-shirt above.'}catch(e){msg(e.message);items.textContent='Unable to load products.'}}
function edit(id){const p=products.find(x=>x.id===id);if(!p)return;editId=id;for(const k of ['title','brand','price','sizes','stock','description'])document.getElementById(k).value=p[k];document.getElementById('condition').value=p.condition;active.checked=!!p.active;formTitle.textContent='Edit Product #'+id;window.scrollTo({top:0,behavior:'smooth'})}
form.onsubmit=async e=>{e.preventDefault();try{const url=editId?'/api/admin/wow-nina/products/'+editId:'/api/admin/wow-nina/products';await api(url,{method:editId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values())});msg('Product saved!');resetForm();await load()}catch(err){msg(err.message)}};
async function upload(id,el){if(!el.files[0])return;const fd=new FormData();fd.append('photo',el.files[0]);try{await api('/api/admin/wow-nina/products/'+id+'/photo',{method:'POST',body:fd});msg('Photo uploaded!');await load()}catch(e){msg(e.message)}}
async function hide(id){if(!confirm('Hide this product from customers?'))return;try{await api('/api/admin/wow-nina/products/'+id,{method:'DELETE'});msg('Product hidden');await load()}catch(e){msg(e.message)}}
if(!token){msg('Please sign in as admin on the homepage first.')}else load();
</script></body></html>
