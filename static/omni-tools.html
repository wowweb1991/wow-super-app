<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WOW OMNI Tools</title><style> *{box-sizing:border-box}body{background:#0B0F19;color:#F8FAFC;font:16px system-ui;margin:0}main{max-width:850px;margin:auto;padding:24px}a{color:#38BDF8}section{background:#131A2B;padding:18px;border-radius:16px;margin:16px 0}input,textarea,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #334155;background:#0B0F19;color:white;max-width:100%}textarea,input:not([type=checkbox]){width:100%;margin:6px 0}button{background:#2563eb;cursor:pointer;margin:4px}output{display:block;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0}label{display:block}h1{color:#38BDF8}</style><main><a href="/">← Home</a><h1>WOW OMNI</h1><p>Free local workspace tools. Notes and tasks stay in this browser, not your account.</p><input id="search" placeholder="Search tools" aria-label="Search tools"><section><h2>Smart Notes</h2><textarea id="notes" rows="6" placeholder="Write your notes"></textarea><button id="save">Save locally</button><output id="saved"></output></section><section><h2>Task List</h2><input id="task" placeholder="New task"><button id="add">Add task</button><div id="tasks"></div></section><section><h2>Omni Calculator</h2><input id="a" type="number" placeholder="First number"><select id="op"><option>+</option><option>-</option><option>×</option><option>÷</option></select><input id="b" type="number" placeholder="Second number"><button id="calc">Calculate</button><output id="result"></output></section><section><h2>Discount Calculator</h2><input id="price" type="number" min="0" placeholder="Original price"><input id="discount" type="number" min="0" max="100" placeholder="Discount %"><button id="disc">Calculate</button><output id="discountResult"></output></section><section><h2>Word Counter</h2><textarea id="words" rows="4" placeholder="Paste text"></textarea><output id="count">0 words · 0 characters</output></section><section><h2>Password Generator</h2><label>Length <input id="length" type="number" min="12" max="128" value="20"></label><button id="generate">Generate</button><output id="password"></output></section><section><h2>Image Resizer</h2><input id="image" type="file" accept="image/png,image/jpeg,image/webp"><input id="width" type="number" min="1" max="4096" value="800" aria-label="Target width"><button id="resize">Resize and save PNG</button><output id="imageStatus"></output></section></main><script>
const $=id=>document.getElementById(id);const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}};
$('notes').value=read('omni.notes','');$('save').onclick=()=>$('saved').textContent=store('omni.notes',$('notes').value)?'Saved on this device.':'Storage unavailable.';
let tasks=read('omni.tasks',[]);if(!Array.isArray(tasks))tasks=[];function render(){const el=$('tasks');el.replaceChildren();tasks.forEach((t,i)=>{const row=document.createElement('div'),c=document.createElement('input'),b=document.createElement('button');c.type='checkbox';c.checked=t.done;c.onchange=()=>{t.done=c.checked;store('omni.tasks',tasks)};b.textContent='Delete';b.onclick=()=>{tasks.splice(i,1);store('omni.tasks',tasks);render()};row.append(c,document.createTextNode(' '+t.text+' '),b);el.append(row)})}render();$('add').onclick=()=>{const t=$('task').value.trim();if(t){tasks.push({text:t,done:false});store('omni.tasks',tasks);$('task').value='';render()}};
$('calc').onclick=()=>{const a=$('a').valueAsNumber,b=$('b').valueAsNumber,o=$('op').value;const r=o==='+'?a+b:o==='-'?a-b:o==='×'?a*b:a/b;$('result').textContent=Number.isFinite(r)?String(r):'Enter valid numbers; division by zero is not allowed.'};
$('disc').onclick=()=>{const p=$('price').valueAsNumber,d=$('discount').valueAsNumber;$('discountResult').textContent=p>=0&&d>=0&&d<=100?'Final price: '+(p*(1-d/100)).toFixed(2)+' | Savings: '+(p*d/100).toFixed(2):'Enter a valid price and discount.'};
$('words').oninput=()=>{const s=$('words').value;$('count').textContent=(s.trim()?s.trim().split(/\s+/).length:0)+' words · '+Array.from(s).length+' characters'};
$('generate').onclick=()=>{const n=$('length').valueAsNumber;if(!Number.isInteger(n)||n<12||n>128)return;const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';$('password').textContent=Array.from(crypto.getRandomValues(new Uint8Array(n)),v=>chars[v&63]).join('')};
$('resize').onclick=async()=>{try{const f=$('image').files[0],w=$('width').valueAsNumber;if(!f||!Number.isInteger(w)||w<1||w>4096)throw Error('Choose an image and valid width.');const img=await createImageBitmap(f);const h=Math.max(1,Math.round(img.height*w/img.width));if(h>8192){img.close();throw Error('Output too tall.')}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);img.close();c.toBlob(b=>{if(!b){$('imageStatus').textContent='Conversion failed.';return}const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='omni-resized.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);$('imageStatus').textContent=w+' × '+h+' PNG ready.'},'image/png')}catch(e){$('imageStatus').textContent=e.message}};
$('search').oninput=()=>document.querySelectorAll('section').forEach(s=>s.hidden=!s.querySelector('h2').textContent.toLowerCase().includes($('search').value.toLowerCase()));
</script></html>
