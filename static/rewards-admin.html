<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WOW Rewards Admin</title><style>body{font:16px system-ui;background:#061326;color:#eef6ff;max-width:1100px;margin:auto;padding:20px}button{background:#087be8;color:white;border:0;padding:10px;border-radius:8px;cursor:pointer;margin:3px}article{border:1px solid #2b6ba3;border-radius:12px;padding:14px;margin:12px 0}small{color:#a9c5e5}input{padding:12px;background:#142b46;color:white;border:1px solid #3c82c5;width:100%;max-width:460px}</style><h1>WOW Rewards · Admin Review</h1><p>Admin account only. Review actual account eligibility and referral legitimacy before approval. Verify GCash QR and payment manually via Messenger. Never request OTP/PIN.</p><input id="token" type="password" placeholder="Paste your admin login token"><button onclick="load()">Load pending records</button><p id="msg"></p><div id="items"></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){let r=await fetch('/api'+path,{...opts,headers:{Authorization:'Bearer '+document.getElementById('token').value,'Content-Type':'application/json'}});let d=await r.json();if(!r.ok)throw Error(d.detail||r.status);return d}
async function decide(kind,id,status){if(!confirm(kind+' #'+id+' → '+status+'? Verify first.'))return;try{await api('/admin/rewards/decision',{method:'POST',body:JSON.stringify({kind,item_id:id,status})});load()}catch(e){alert(e.message)}}
function actions(kind,id,states){return states.map(s=>'<button onclick="decide(\''+kind+'\','+id+',\''+s+'\')">'+s+'</button>').join('')}
async function load(){try{let d=await api('/admin/rewards');let html='<h2>Welcome verification</h2>'+d.welcome.map(x=>'<article>User #'+x.user_id+' · '+esc(x.email)+' · approved: '+x.welcome_approved+'<p>'+actions('welcome',x.user_id,['approved','rejected'])+'</p></article>').join('');html+='<h2>Referral verification</h2>'+d.referrals.map(x=>'<article>Referral #'+x.id+' · referrer #'+x.referrer_id+' → referred #'+x.referred_id+' · '+esc(x.status)+(x.status==='pending'?'<p>'+actions('referral',x.id,['approved','rejected'])+'</p>':'')+'</article>').join('');html+='<h2>Withdrawal claims</h2>'+d.claims.map(x=>'<article>Claim #'+x.id+' · user #'+x.user_id+' · '+esc(x.email)+' · ₱'+x.amount+' · '+esc(x.status)+'<p>Check GCash QR in Messenger or existing app QR records.</p>'+(x.status==='pending'?actions('claim',x.id,['approved','rejected']):x.status==='approved'?actions('claim',x.id,['paid']):'')+'</article>').join('');document.getElementById('items').innerHTML=html;document.getElementById('msg').textContent='Loaded. Approval is manual.'}catch(e){document.getElementById('msg').textContent='Access denied or error: '+e.message}}
</script></html>
