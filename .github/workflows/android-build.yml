name: Android build validation
on:
  workflow_dispatch:
  push:
    branches: [android-play-build-prep]
    paths: ['android/**', '.github/workflows/android-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub Ubuntu runners already provide the Android SDK.
      # Avoid setup-android bootstrap failures; install the required SDK packages explicitly.
      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools not found on runner"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure optional upload signing
        shell: bash
        env:
          WOW_KEYSTORE_BASE64: ${{ secrets.WOW_KEYSTORE_BASE64 }}
          WOW_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.WOW_UPLOAD_KEYSTORE_PASSWORD }}
          WOW_UPLOAD_KEY_ALIAS: ${{ secrets.WOW_UPLOAD_KEY_ALIAS }}
          WOW_UPLOAD_KEY_PASSWORD: ${{ secrets.WOW_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$WOW_KEYSTORE_BASE64" ] && [ -n "$WOW_UPLOAD_KEYSTORE_PASSWORD" ] && [ -n "$WOW_UPLOAD_KEY_ALIAS" ] && [ -n "$WOW_UPLOAD_KEY_PASSWORD" ]; then
            printf '%s' "$WOW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wow-upload.jks"
            echo "WOW_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/wow-upload.jks" >> "$GITHUB_ENV"
            echo "WOW_UPLOAD_KEYSTORE_PASSWORD=$WOW_UPLOAD_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "WOW_UPLOAD_KEY_ALIAS=$WOW_UPLOAD_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "WOW_UPLOAD_KEY_PASSWORD=$WOW_UPLOAD_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNED_BUILD=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED_BUILD=false" >> "$GITHUB_ENV"
            echo "No upload signing secrets configured; building validation-only unsigned release."
          fi
      - name: Compile Android app
        run: gradle :app:assembleDebug :app:bundleRelease
      - name: Verify Android build outputs
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          echo "Android APK and AAB generated successfully."
          if [ "${SIGNED_BUILD:-false}" = "true" ]; then
            jarsigner -verify -strict app/build/outputs/bundle/release/app-release.aab
            echo "Release AAB signature verified."
          else
            echo "::notice::Release AAB is unsigned and MUST NOT be uploaded to Google Play."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wow-android-build
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
